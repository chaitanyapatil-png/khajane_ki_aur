<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treasure Hunt – Entry Gate</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Trebuchet MS', Arial, sans-serif;
  background:
    linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)),
    url('img/a.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* MAIN GATE */
.gate {
  text-align: center;
  padding: 60px 40px;
  border: 3px solid gold;
  border-radius: 25px;
  background: rgba(20,20,40,0.9);
  box-shadow: 0 0 40px gold;
  max-width: 600px;
}

/* BUTTON */
.enter-btn {
  padding: 15px 45px;
  font-size: 20px;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  background: linear-gradient(135deg, #f7971e, #ffd200);
  font-weight: bold;
}

/* LOCK SCREEN */
.lock-screen {
  display: none;
  flex-direction: column;
  gap: 15px;
}

.lock-icon {
  font-size: 60px;
}

input {
  padding: 12px;
  font-size: 18px;
  border-radius: 10px;
  border: none;
  text-align: center;
}

.unlock-btn {
  padding: 12px;
  font-size: 18px;
  border-radius: 25px;
  border: none;
  background: gold;
  cursor: pointer;
}

.error {
  color: #ff7070;
  font-size: 14px;
}

/* SHAKE ANIMATION */
@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  75% { transform: translateX(-5px); }
  100% { transform: translateX(0); }
}

.shake {
  animation: shake 0.4s;
}

/* MOBILE */
@media (max-width:600px){
  .gate{padding:35px 20px}
}
</style>
</head>

<body>

<div class="gate" id="gateBox">

  <!-- INTRO -->
  <div id="intro">
    <h1>🏴‍☠️ खजाने की ओर 🏴‍☠️</h1>
    <p>Are you Fantastic?</p>
    <button class="enter-btn" onclick="showLock()">Come In Plz</button>
  </div>
  <!-- LOCK -->
  <div class="lock-screen" id="lock">
    <div class="lock-icon">🔐</div>
      <p>Opps sorry , <br>I forgot to told you<br> do you have addition of <b style="color: red;"> Red </b> and <b style="color: blue;">Blue</b> lines</p>

      <input type="password" id="pin" placeholder="****">

      <button class="unlock-btn" onclick="checkPin()">Unlock</button>
      <button class="unlock-btn" onclick="togglePin()">👁 Show / Hide</button>

    <div class="error" id="error"></div>
  </div>
</div>
<!-- AUDIO -->
<audio id="wrongSound" src="song/wrong.mp3"></audio>
<audio id="correctSound" src="song/found.mp3"></audio>
<audio id="openSound" src="song/a.mp3"></audio>




<script>
const CORRECT_PIN = "1"; // 🔑 change pin here

function showLock(){
  document.getElementById("intro").style.display = "none";
  document.getElementById("lock").style.display = "flex";
}

function togglePin(){
  const pin = document.getElementById("pin");
  pin.type = pin.type === "password" ? "text" : "password";
}

function checkPin(){
  const pin = document.getElementById("pin").value;
  const box = document.getElementById("gateBox");
  const error = document.getElementById("error");

if (pin === CORRECT_PIN) {
  document.getElementById("correctSound").play();

  setTimeout(() => {
    document.getElementById("openSound").play();
    box.innerHTML = "<h1>🚪 Gate Opened!</h1><p>Welcome to the Treasure Hunt 🏆</p>";

    // 👉 GO TO NEXT PAGE
    setTimeout(() => {
      window.location.href = "box.html";
    }, 1200); // wait for open sound / animation

  }, 1000);
}
 else {
    document.getElementById("wrongSound").play();
    error.textContent = "❌ Wrong PIN!";
    box.classList.add("shake");
    setTimeout(()=>box.classList.remove("shake"),10000);
  }
}
</script>

</body>
</html>
